<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MX Tasks</title>

<style>
:root{
--bg:#f5f5f4;
--card:#fff;
--text:#111;
--border:#ddd;
--blue:#1a56a0;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
}

header{
padding:16px;
background:#fff;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

button{
border:none;
background:var(--blue);
color:#fff;
padding:10px 14px;
border-radius:10px;
font-size:15px;
}

.container{
padding:16px;
}

.card{
background:var(--card);
padding:14px;
border-radius:14px;
margin-bottom:12px;
border:1px solid var(--border);
}

input,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.photo{
width:100%;
border-radius:10px;
margin-top:10px;
}

.small{
font-size:13px;
opacity:.7;
margin-top:6px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<header>
<h3>✈️ MX Tasks</h3>
<button onclick="newTask()">+ Task</button>
</header>

<div class="container">

<input id="search" placeholder="Tìm task..." oninput="render()">

<div id="list"></div>

<div id="editor" class="hidden">

<input id="name" placeholder="Tên task">

<input id="aircraft" placeholder="Aircraft">

<textarea id="steps" placeholder="Checklist mỗi dòng 1 bước"></textarea>

<textarea id="materials" placeholder="Vật tư"></textarea>

<textarea id="tools" placeholder="Tools"></textarea>

<input type="file" accept="image/*" capture="environment" id="photo">

<div id="photos"></div>

<button onclick="saveTask()">Lưu task</button>

</div>

</div>

<script>

let tasks=JSON.parse(localStorage.getItem("mx_tasks")||"[]")

let current=null

function saveDB(){
localStorage.setItem("mx_tasks",JSON.stringify(tasks))
}

function toggleCheck(taskIndex,stepIndex,val){

if(!tasks[taskIndex].stepsDone){
tasks[taskIndex].stepsDone=[]
}

tasks[taskIndex].stepsDone[stepIndex]=val

saveDB()

render()

}

function render(){

const search=document.getElementById("search")
const list=document.getElementById("list")
const editor=document.getElementById("editor")

const q=search.value.toLowerCase()

list.innerHTML=""

const filtered=tasks.filter(t=>
(t.name||"").toLowerCase().includes(q) ||
(t.aircraft||"").toLowerCase().includes(q)
)

filtered.forEach((t,i)=>{

const div=document.createElement("div")

div.className="card"

const done=t.stepsDone||[]

const total=t.steps.length

const checked=done.filter(Boolean).length

const checklist=t.steps.map((s,idx)=>`
<label style="display:flex;gap:10px;margin-top:10px">
<input type="checkbox"
${done[idx]?"checked":""}
onchange="toggleCheck(${i},${idx},this.checked)">
<span>${s}</span>
</label>
`).join("")

div.innerHTML=`

<h3>${t.name}</h3>

<div class="small">${t.aircraft||""}</div>

<div class="small">
${checked}/${total} checklist
</div>

${checklist}

<button
style="margin-top:12px"
onclick="event.stopPropagation();openTask(${i})">
✏️ Edit
</button>

`

list.appendChild(div)

})

}

function newTask(){

current=null

document.getElementById("editor").classList.remove("hidden")

document.getElementById("search").style.display="none"
document.getElementById("list").style.display="none"

document.getElementById("name").value=""
document.getElementById("aircraft").value=""
document.getElementById("steps").value=""
document.getElementById("materials").value=""
document.getElementById("tools").value=""
document.getElementById("photos").innerHTML=""

}

function openTask(i){

current=i

const t=tasks[i]

document.getElementById("editor").classList.remove("hidden")

document.getElementById("search").style.display="none"
document.getElementById("list").style.display="none"

document.getElementById("name").value=t.name
document.getElementById("aircraft").value=t.aircraft
document.getElementById("steps").value=t.steps.join("\n")
document.getElementById("materials").value=t.materials.join("\n")
document.getElementById("tools").value=t.tools.join("\n")

renderPhotos(t.photos||[])

}

function renderPhotos(arr){

const p=document.getElementById("photos")

p.innerHTML=""

arr.forEach(src=>{

const img=document.createElement("img")

img.src=src

img.className="photo"

p.appendChild(img)

})

}

document.getElementById("photo").addEventListener("change",e=>{

const file=e.target.files[0]

if(!file)return

const reader=new FileReader()

reader.onload=()=>{

const img=reader.result

const box=document.getElementById("photos")

const im=document.createElement("img")

im.src=img

im.className="photo"

box.appendChild(im)

}

reader.readAsDataURL(file)

})

function saveTask(){

const photos=[...document.querySelectorAll(".photo")].map(i=>i.src)

const obj={

name:document.getElementById("name").value,

aircraft:document.getElementById("aircraft").value,

steps:document.getElementById("steps").value.split("\n").filter(Boolean),

materials:document.getElementById("materials").value.split("\n").filter(Boolean),

tools:document.getElementById("tools").value.split("\n").filter(Boolean),

photos,

stepsDone:
current!==null && tasks[current].stepsDone
? tasks[current].stepsDone
: []

}

if(current===null){
tasks.unshift(obj)
}else{
tasks[current]=obj
}

saveDB()

document.getElementById("search").style.display="block"
document.getElementById("list").style.display="block"
document.getElementById("editor").classList.add("hidden")

render()

alert("Đã lưu")

}

render()

</script>

</body>
</html>
